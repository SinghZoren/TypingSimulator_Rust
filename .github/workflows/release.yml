name: Build desktop downloads

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify and build
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item target/release/TypingSimulator.exe package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath TypingSimulator-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TypingSimulator-windows-x64
          path: TypingSimulator-windows-x64.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package universal app
        run: |
          mkdir -p "Typing Simulator.app/Contents/MacOS"
          mkdir -p "Typing Simulator.app/Contents/Resources" icon.iconset
          lipo -create \
            target/aarch64-apple-darwin/release/TypingSimulator \
            target/x86_64-apple-darwin/release/TypingSimulator \
            -output "Typing Simulator.app/Contents/MacOS/TypingSimulator"
          cp packaging/macos/Info.plist "Typing Simulator.app/Contents/Info.plist"
          sips -z 16 16 assets/icon.png --out icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 assets/icon.png --out icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 assets/icon.png --out icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 assets/icon.png --out icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 assets/icon.png --out icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 assets/icon.png --out icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 assets/icon.png --out icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 assets/icon.png --out icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 assets/icon.png --out icon.iconset/icon_512x512.png >/dev/null
          cp assets/icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns -o "Typing Simulator.app/Contents/Resources/AppIcon.icns" icon.iconset
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" "Typing Simulator.app/Contents/Info.plist"
            plutil -replace CFBundleVersion -string "${GITHUB_REF_NAME#v}" "Typing Simulator.app/Contents/Info.plist"
          fi
          # Sign the completed universal bundle, after all files and metadata are in place.
          # An ad-hoc signature gives this build an explicit code identity, but a
          # Developer ID signature is needed for stable identity across releases.
          codesign --force --sign - --identifier com.singhzoren.typingsimulator "Typing Simulator.app"
          codesign --verify --deep --strict --verbose=2 "Typing Simulator.app"
          ditto -c -k --sequesterRsrc --keepParent "Typing Simulator.app" TypingSimulator-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TypingSimulator-macos-universal
          path: TypingSimulator-macos-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.zip
